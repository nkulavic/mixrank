name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: go test -race -timeout 180s ./...
      - run: go vet ./...
      - run: python scripts/generate.py --check
      - run: python scripts/package.py --check
      - run: python scripts/verify.py
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/package.py --release
      - name: Verify native installer completion
        env:
          MIXRANK_API_KEY: synthetic-ci-credential
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          "./dist/mixrank_${version}_linux_amd64/mixrank" setup --components cli --destination "$RUNNER_TEMP/mixrank-install" --yes
      - uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
            dist/checksums.txt
            dist/install.*
