name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 180s ./...
      - run: go vet ./...
      - run: python3 scripts/generate.py --check
      - run: python3 scripts/package.py --check
      - run: python3 scripts/verify.py
      - run: python3 scripts/package.py --release
      - name: Publish native binaries and agent packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          assets=(
            dist/checksums.txt
            dist/install.sh
            dist/install.ps1
            dist/mixrank-claude*.zip
            dist/mixrank-codex*.zip
            dist/mixrank-cowork.zip
            dist/mixrank_${version}_*.tar.gz
            dist/mixrank_${version}_*.zip
            dist/mixrank_*\.mcpb
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "MixRank $GITHUB_REF_NAME" --notes-file docs/release-notes.md --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "MixRank $GITHUB_REF_NAME" --notes-file docs/release-notes.md "${assets[@]}"
          fi
